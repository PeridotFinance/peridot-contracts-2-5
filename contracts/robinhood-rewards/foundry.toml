# Isolated project for the Robinhood Chain (4663) RAM rewards distributor (port of the Avalanche design A distributor).
# Compiler settings follow the Robinhood TP/SL profile `robinhood_orders` (solc 0.8.26, EVM cancun, via-IR): Robinhood Chain
# is an Arbitrum Orbit chain without the Osaka opcodes the Avalanche project compiles for.
# lib/ holds two symlinks (gitignored): forge-std and openzeppelin-contracts (OpenZeppelin 5.3.0), see README.md.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/fixtures" }, { access = "read-write", path = "./deployments" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[fuzz]
seed = "0x2a"
runs = 256

[invariant]
runs = 64
depth = 64

[lint]
lint_on_build = false
