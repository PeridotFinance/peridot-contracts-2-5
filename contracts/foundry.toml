[profile.default]
src = 'contracts'
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
script = 'ignored_scripts'
cache_path  = 'cache_forge'
via_ir = true
ignored_error_codes = [3628, 2072, 5667, 2018]
optimizer = true
optimizer_runs = 200
remappings = [
    "ds-test/=lib/forge-std/lib/ds-test/src/",
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "@chainlink/contracts-ccip/contracts/=node_modules/@chainlink/contracts-ccip/contracts/",
    "@chainlink/contracts/=node_modules/@chainlink/contracts/",
    "solidity-bytes-utils/=lib/solidity-bytes-utils/",
    "@layerzerolabs/lz-evm-protocol-v2/=lib/lz-address-book/lib/LayerZero-v2/packages/layerzero-v2/evm/protocol/",
    "@layerzerolabs/lz-evm-messagelib-v2/=lib/lz-address-book/lib/LayerZero-v2/packages/layerzero-v2/evm/messagelib/",
    "@layerzerolabs/oft-evm/=lib/lz-address-book/lib/devtools/packages/oft-evm/",
    "@layerzerolabs/oft-evm-upgradeable/=lib/lz-address-book/lib/devtools/packages/oft-evm-upgradeable/",
    "@layerzerolabs/oapp-evm/=lib/lz-address-book/lib/devtools/packages/oapp-evm/",
    "@layerzerolabs/oapp-evm-upgradeable/=lib/lz-address-book/lib/devtools/packages/oapp-evm-upgradeable/",
    "@layerzerolabs/test-devtools-evm-foundry/=lib/lz-address-book/lib/devtools/packages/test-devtools-evm-foundry/",
    "@layerzerolabs/lz-evm-v1-0.7/=contracts/vendor/layerzero-lz-evm-v1-0.7/",
    "lz-address-book/=lib/lz-address-book/src/",
]

metadata = true
metadata_hash = "none" 
use_literal_content = true

# Use this profile only when you explicitly need IR builds
[profile.ir]
via_ir = true
optimizer = true
optimizer_runs = 200

[profile.somnia]
via_ir = false
optimizer = true
optimizer_runs = 50  # adjust if needed