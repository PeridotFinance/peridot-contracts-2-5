# Isolated project for the Pharaoh DLMM USDC/USDt 3-bin vault. Same compiler settings as ../vault-r3 (solc 0.8.35, optimizer 200 runs, EVM osaka, via-IR). OpenZeppelin 5.3.0 from ../lib (gitignored; symlinks, see vault-r3).
[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
solc_version = "0.8.35"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
use_literal_content = true
ignored_error_codes = [3628, 2072, 5667, 2018]
# read-only access to the golden fixtures that tools/rewards-test/ generates and test/rewards/PharRewardsCrossCheck.t.sol checks against the contract
fs_permissions = [{ access = "read", path = "./test/rewards/fixtures" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
]

# the endpoint is an ENVIRONMENT REFERENCE, never a value in this file
[rpc_endpoints]
avalanche = "${AVALANCHE_MAINNET_RPC_URL}"
